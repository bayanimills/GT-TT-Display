<svg xmlns="http://www.w3.org/2000/svg" width="800" height="800" viewBox="0 0 800 800">
  <defs>
    <style>
      .title { fill: #ffffff; font-family: Arial, Helvetica, sans-serif; font-size: 30px; font-weight: 700; }
      .subtitle { fill: #aeb4bf; font-family: Arial, Helvetica, sans-serif; font-size: 17px; font-weight: 400; }
      .card-title { fill: #ffffff; font-family: Arial, Helvetica, sans-serif; font-size: 19px; font-weight: 700; }
      .card-note { fill: #aeb4bf; font-family: Arial, Helvetica, sans-serif; font-size: 14px; font-weight: 400; }
      .icon { fill: none; stroke: #d4021b; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
      .accent-fill { fill: #d4021b; }
      .off-text { fill: #d4021b; font-family: Arial, Helvetica, sans-serif; font-size: 15px; font-weight: 800; letter-spacing: 0.5px; }
      .zz-text { fill: #d4021b; font-family: Arial, Helvetica, sans-serif; font-size: 18px; font-weight: 800; }
    </style>
  </defs>

  <rect width="1200" height="720" fill="#050506"/>
  <text x="54" y="54" class="title">Turbo Touch display-off icon concepts</text>
  <text x="54" y="84" class="subtitle">Shown at 2x. The live button remains 44 x 44 pixels inside the dark panel.</text>

  <!-- Card 1 -->
  <g transform="translate(40 120)">
    <rect width="350" height="200" rx="18" fill="#0f1218" stroke="#242832"/>
    <circle cx="72" cy="80" r="44" fill="#0f1218" fill-opacity=".88" stroke="#d4021b" stroke-width="2"/>
    <g transform="translate(45 53)">
      <rect x="5" y="3" width="44" height="30" rx="3" class="icon"/>
      <path d="M27 33v8M17 43h20" class="icon"/>
      <path d="M3 2l50 48" class="icon"/>
    </g>
    <text x="132" y="62" class="card-title">A. Slash</text>
    <text x="132" y="88" class="card-note">Current test. Strong “off,”</text>
    <text x="132" y="109" class="card-note">but the screen shape is busier.</text>
    <text x="24" y="173" class="card-note">Meaning: display disabled</text>
  </g>

  <!-- Card 2 -->
  <g transform="translate(410 120)">
    <rect width="350" height="200" rx="18" fill="#0f1218" stroke="#242832"/>
    <circle cx="72" cy="80" r="44" fill="#0f1218" fill-opacity=".88" stroke="#d4021b" stroke-width="2"/>
    <g transform="translate(44 53)">
      <rect x="2" y="5" width="42" height="29" rx="3" class="icon"/>
      <path d="M23 34v8M14 44h18" class="icon"/>
      <path d="M48 8c-8 2-11 12-5 18 4 4 10 4 14 1-2 8-12 12-19 7-8-6-6-19 3-23 2-1 5-2 7-3z" class="accent-fill"/>
    </g>
    <text x="132" y="62" class="card-title">B. Moon</text>
    <text x="132" y="88" class="card-note">Reads as screen sleep.</text>
    <text x="132" y="109" class="card-note">Cleanest pictogram.</text>
    <text x="24" y="173" class="card-note">Meaning: put display to sleep</text>
  </g>

  <!-- Card 3 -->
  <g transform="translate(40 340)">
    <rect width="350" height="200" rx="18" fill="#0f1218" stroke="#242832"/>
    <circle cx="72" cy="80" r="44" fill="#0f1218" fill-opacity=".88" stroke="#d4021b" stroke-width="2"/>
    <g transform="translate(43 53)">
      <rect x="2" y="7" width="42" height="29" rx="3" class="icon"/>
      <path d="M23 36v8M14 46h18" class="icon"/>
      <text x="39" y="19" class="zz-text">Z</text>
      <text x="48" y="9" class="zz-text" style="font-size:13px">Z</text>
    </g>
    <text x="132" y="62" class="card-title">C. Zz</text>
    <text x="132" y="88" class="card-note">Very explicit sleep cue.</text>
    <text x="132" y="109" class="card-note">Slightly more playful.</text>
    <text x="24" y="173" class="card-note">Meaning: sleep the display</text>
  </g>

  <!-- Card 4 -->
  <g transform="translate(410 340)">
    <rect width="350" height="200" rx="18" fill="#0f1218" stroke="#242832"/>
    <circle cx="72" cy="80" r="44" fill="#0f1218" fill-opacity=".88" stroke="#d4021b" stroke-width="2"/>
    <g transform="translate(43 53)">
      <rect x="2" y="4" width="52" height="34" rx="3" class="icon"/>
      <path d="M28 38v8M18 48h20" class="icon"/>
      <text x="11" y="27" class="off-text">OFF</text>
    </g>
    <text x="132" y="62" class="card-title">D. OFF</text>
    <text x="132" y="88" class="card-note">Most literal option.</text>
    <text x="132" y="109" class="card-note">Small text may be less crisp.</text>
    <text x="24" y="173" class="card-note">Meaning: turn display off</text>
  </g>

  <!-- Card 5 -->
  <g transform="translate(40 560)">
    <rect width="350" height="200" rx="18" fill="#0f1218" stroke="#242832"/>
    <circle cx="72" cy="80" r="44" fill="#0f1218" fill-opacity=".88" stroke="#d4021b" stroke-width="2"/>
    <g transform="translate(43 53)">
      <rect x="2" y="4" width="52" height="34" rx="3" class="icon"/>
      <path d="M28 38v8M18 48h20" class="icon"/>
      <circle cx="28" cy="21" r="9" class="icon"/>
      <path d="M28 9v12" class="icon"/>
    </g>
    <text x="132" y="62" class="card-title">E. Screen power</text>
    <text x="132" y="88" class="card-note">Power mark stays visibly</text>
    <text x="132" y="109" class="card-note">inside the monitor.</text>
    <text x="24" y="173" class="card-note">Meaning: display power only</text>
  </g>

  <!-- Card 6 -->
  <g transform="translate(410 560)">
    <rect width="350" height="200" rx="18" fill="#0f1218" stroke="#242832"/>
    <circle cx="72" cy="80" r="44" fill="#0f1218" fill-opacity=".88" stroke="#d4021b" stroke-width="2"/>
    <g transform="translate(43 53)">
      <rect x="2" y="4" width="52" height="34" rx="3" class="icon"/>
      <path d="M28 38v8M18 48h20" class="icon"/>
      <path d="M18 21h20" class="icon"/>
    </g>
    <text x="132" y="62" class="card-title">F. Dim bar</text>
    <text x="132" y="88" class="card-note">Simple at small sizes.</text>
    <text x="132" y="109" class="card-note">Could read as minimize.</text>
    <text x="24" y="173" class="card-note">Meaning: blank the display</text>
  </g>
</svg>
