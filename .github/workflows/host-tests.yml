name: Host UI tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  # A squash merge gives the default branch a new SHA but, when the PR was up to date, the
  # same git tree the PR run already tested. Skip the jobs below on that push only when the
  # merged PR's head has the same tree and a successful run of this workflow. Any doubt
  # (no PR, tree differs, no green PR run, API error) runs them. Other events always run.
  dedupe-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      actions: read
    outputs:
      needed: ${{ steps.check.outputs.needed || 'true' }}
    steps:
      - id: check
        if: ${{ github.event_name == 'push' }}
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          WORKFLOW_REF: ${{ github.workflow_ref }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const sha = context.sha;
            let needed = true;
            try {
              const workflow = process.env.WORKFLOW_REF.split('@')[0].split('/.github/workflows/')[1];
              const base = context.payload.repository.default_branch;
              const { data: pulls } = await github.request('GET /repos/{owner}/{repo}/commits/{sha}/pulls', { owner, repo, sha, per_page: 100 });
              const pr = pulls.find((p) => p.merged_at && p.merge_commit_sha === sha && p.base.ref === base);
              if (workflow && pr) {
                const tree = async (commit_sha) => (await github.rest.git.getCommit({ owner, repo, commit_sha })).data.tree.sha;
                if ((await tree(pr.head.sha)) === (await tree(sha))) {
                  const { data } = await github.rest.actions.listWorkflowRuns({ owner, repo, workflow_id: workflow, head_sha: pr.head.sha, event: 'pull_request', per_page: 100 });
                  const runs = data.workflow_runs
                    .filter((r) => r.head_sha === pr.head.sha)
                    .sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
                  if (runs.length && runs[0].status === 'completed' && runs[0].conclusion === 'success') {
                    needed = false;
                    core.info(`Same tree as PR #${pr.number}, already passed: ${runs[0].html_url}`);
                  }
                }
              }
            } catch (error) {
              core.warning(`Dedupe check failed, running the jobs: ${error.message}`);
            }
            core.setOutput('needed', String(needed));

  simulator-and-unit-tests:
    needs: dedupe-check
    if: ${{ github.event_name != 'push' || needs.dedupe-check.outputs.needed == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install test dependency
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - name: Build simulator
        run: make -C sim -j2
      - name: Run host tests
        run: |
          cc -std=c11 -Wall -Wextra -Werror -Imain \
            tests/test_display_schedule.c main/display_schedule.c -o /tmp/schedule
          /tmp/schedule
          cc -std=c11 -Wall -Wextra -Werror -Imain \
            tests/test_display_button_visibility.c main/display_button_visibility.c -o /tmp/visibility
          /tmp/visibility
          cc -std=c11 -Wall -Wextra -Werror -Imain \
            tests/test_ota_release.c main/ota_release.c -o /tmp/ota_release
          /tmp/ota_release
          cc -std=c11 -Wall -Wextra -Werror -Imain \
            -Icomponents/lvgl__lvgl tests/test_feed_web.c main/feed_web.c -o /tmp/feed_web
          /tmp/feed_web
          bash tests/test_settings_ui_contract.sh
          bash tests/test_glass_data_ui_contract.sh
          cc -std=gnu11 -DLV_CONF_INCLUDE_SIMPLE \
            -Isim/stubs -Imain -Icomponents -Icomponents/lvgl__lvgl \
            -Icomponents/lvgl__lvgl/src sim/test_chain.c sim/sim_rt.c \
            -o /tmp/test_chain -lm -lpthread
          /tmp/test_chain
      - name: Compile firmware sources at the warning level the device build uses
        working-directory: sim
        # The simulator builds with -Wno-format-truncation and friends, so a
        # -Werror the ESP-IDF build treats as fatal can pass here and fail
        # three minutes into the release job. Compile the same translation
        # units under the device flags first.
        run: |
          for f in price ota_screen settings clock glass feed feed_web weather                    chain poolping odds block mempool payout home night; do
            cc -std=gnu17 -c -Og -o /dev/null               -Wall -Wextra -Werror=all -Werror=format-truncation               -Wno-unused-parameter -Wno-sign-compare -Wno-error=unused-function               -Wno-error=unused-variable -Wno-error=unused-but-set-variable               -DLV_CONF_INCLUDE_SIMPLE -Istubs -I../main -I../components               -I../components/lvgl__lvgl -I../components/lvgl__lvgl/src               ../main/$f.c
          done

      - name: Syntax-check hardware-only updater
        working-directory: sim
        run: |
          cc -std=gnu11 -fsyntax-only -DLV_CONF_INCLUDE_SIMPLE \
            -Istubs -I../main -I../components -I../components/lvgl__lvgl \
            -I../components/lvgl__lvgl/src \
            ../main/ota_update.c ../main/ota_release.c
      - name: Smoke-test redacted screenshot path
        working-directory: sim
        run: |
          python3 shot.py /tmp/shots --screen payout --preset 0 --skin classic --settle 0.1
          python3 shot.py /tmp/shots --screen home --preset 0 --skin classic \
            --cmd "O show" --cmd "O error smoke" --cmd "O hide" \
            --name ota-return --settle 0.1
